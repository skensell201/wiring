name: CI
on:
  push:
    branches: [master]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # The same suite again with coverage, which enforces the thresholds in vite.config.ts.
      - run: pnpm test:coverage
      - run: pnpm build

  # The backend is built and tested on the platforms the app ships for. A Linux-only job would
  # never notice a change that breaks the macOS or Windows build.
  backend:
    name: backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt, llvm-tools-preview" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri, shared-key: wiring }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile && pnpm build   # generate_context! needs dist/
      # Formatting is platform-independent, so it is checked once.
      - name: cargo fmt --check
        if: runner.os == 'Linux'
        run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri
      # Coverage runs on Linux only: it instruments every target, which would double the
      # duration of the other two jobs for the same numbers.
      - name: Install cargo-llvm-cov
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: cargo llvm-cov
        if: runner.os == 'Linux'
        run: >
          cargo llvm-cov --all-targets --summary-only
          --fail-under-regions 87 --fail-under-functions 82 --fail-under-lines 87
        working-directory: src-tauri

  # The branded Windows installer. NSIS installers are produced on Windows, so this job is the
  # only place the custom .nsi template is exercised end to end; the artifact is the installer
  # to download and run on a real machine.
  installer:
    name: installer (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri, shared-key: wiring }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: wiring-installer-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # The smoke test needs a cluster. kind creates one only where Docker runs Linux containers,
  # which on GitHub-hosted runners means Linux: the hosted macOS and Windows runners have no
  # Docker for Linux containers, so the cluster-based coverage stays here.
  smoke:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with: { cluster_name: kind }
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri, shared-key: wiring }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile && pnpm build
      - name: Run the smoke test
        run: cargo test --test smoke -- --ignored --nocapture
        working-directory: src-tauri
        env:
          WIRING_SMOKE_CONTEXT: kind-kind
          # The custom resource and Helm phases create a CRD; the cluster here is the job's
          # own kind cluster, so it may.
          WIRING_SMOKE_EXTRAS: "1"
