<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- App icon source: dark tile on Apple's 824/1024 grid, Wire W mark in the Pink → Ice gradient.
       Regenerate the platform icons with `pnpm tauri icon src-tauri/icons/wiring.svg`. -->
  <defs>
    <linearGradient id="wire" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="0.33" stop-color="#7c3aed"/>
      <stop offset="0.67" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#211c2e"/>
      <stop offset="1" stop-color="#15111f"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#tile)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
  <g transform="translate(100 100) scale(12.875)">
    <path d="M12 18 L20 46 L32 26 L44 46 L52 18" fill="none" stroke="url(#wire)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="12" cy="18" r="4.5" fill="#1a1524" stroke="url(#wire)" stroke-width="3"/>
    <circle cx="32" cy="26" r="4.5" fill="#1a1524" stroke="url(#wire)" stroke-width="3"/>
    <circle cx="52" cy="18" r="4.5" fill="#1a1524" stroke="url(#wire)" stroke-width="3"/>
  </g>
</svg>
