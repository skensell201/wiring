apiVersion: v1
kind: Namespace
metadata: { name: wiring-smoke }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: web-cfg, namespace: wiring-smoke }
data: { GREETING: hello }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: web, namespace: wiring-smoke }
spec:
  replicas: 2
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      containers:
        - name: web
          image: registry.k8s.io/pause:3.9
          envFrom: [ { configMapRef: { name: web-cfg } } ]
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: wiring-smoke }
spec: { selector: { app: web }, ports: [ { port: 80, targetPort: 80 } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: talker, namespace: wiring-smoke }
spec:
  replicas: 1
  selector: { matchLabels: { app: talker } }
  template:
    metadata: { labels: { app: talker } }
    spec:
      containers:
        - name: talker
          image: busybox:1.36
          command: [ "sh", "-c", "i=0; while true; do echo \"tick $i\"; i=$((i+1)); sleep 1; done" ]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: db, namespace: wiring-smoke }
spec:
  replicas: 1
  serviceName: db
  selector: { matchLabels: { app: db } }
  template:
    metadata: { labels: { app: db } }
    spec: { containers: [ { name: db, image: "registry.k8s.io/pause:3.9" } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: broken, namespace: wiring-smoke }
spec:
  replicas: 1
  selector: { matchLabels: { app: broken } }
  template:
    metadata: { labels: { app: broken } }
    spec: { containers: [ { name: broken, image: "registry.k8s.io/pause:wiring-does-not-exist" } ] }
