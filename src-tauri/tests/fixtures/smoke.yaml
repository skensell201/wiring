apiVersion: v1
kind: Namespace
metadata: { name: wiring-smoke }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: web-cfg, namespace: wiring-smoke }
data: { GREETING: hello }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: web, namespace: wiring-smoke }
spec:
  replicas: 2
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      containers:
        - name: web
          image: registry.k8s.io/pause:3.9
          envFrom: [ { configMapRef: { name: web-cfg } } ]
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: wiring-smoke }
spec: { selector: { app: web }, ports: [ { port: 80, targetPort: 80 } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: talker, namespace: wiring-smoke }
spec:
  replicas: 1
  selector: { matchLabels: { app: talker } }
  template:
    metadata: { labels: { app: talker } }
    spec:
      containers:
        - name: talker
          image: busybox:1.36
          command: [ "sh", "-c", "i=0; while true; do echo \"tick $i\"; i=$((i+1)); sleep 1; done" ]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: db, namespace: wiring-smoke }
spec:
  replicas: 1
  serviceName: db
  selector: { matchLabels: { app: db } }
  template:
    metadata: { labels: { app: db } }
    spec: { containers: [ { name: db, image: "registry.k8s.io/pause:3.9" } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: broken, namespace: wiring-smoke }
spec:
  replicas: 1
  selector: { matchLabels: { app: broken } }
  template:
    metadata: { labels: { app: broken } }
    spec: { containers: [ { name: broken, image: "registry.k8s.io/pause:wiring-does-not-exist" } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: whoami, namespace: wiring-smoke }
spec:
  replicas: 2
  selector: { matchLabels: { app: whoami } }
  template:
    metadata: { labels: { app: whoami } }
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10
          ports: [ { name: http, containerPort: 80 } ]
          readinessProbe: { httpGet: { path: /, port: http } }
---
apiVersion: v1
kind: Service
metadata: { name: whoami, namespace: wiring-smoke }
spec: { selector: { app: whoami }, ports: [ { name: web, port: 8080, targetPort: http } ] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: web-from-talker, namespace: wiring-smoke }
spec:
  podSelector: { matchLabels: { app: web } }
  policyTypes: [ Ingress ]
  ingress: [ { from: [ { podSelector: { matchLabels: { app: talker } } } ], ports: [ { protocol: TCP, port: 80 } ] } ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: pod-reader, namespace: wiring-smoke }
rules: [ { apiGroups: [ "" ], resources: [ pods ], verbs: [ get, list ] } ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: default-reads-pods, namespace: wiring-smoke }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: pod-reader }
subjects: [ { kind: ServiceAccount, name: default, namespace: wiring-smoke } ]
