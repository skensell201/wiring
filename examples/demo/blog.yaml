# Demo namespace "blog": a small, healthy app for switching namespaces.
apiVersion: v1
kind: Namespace
metadata: { name: blog }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: blog-config, namespace: blog }
data: { TITLE: "Wiring Blog" }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: blog, namespace: blog, labels: { app: blog } }
spec:
  replicas: 2
  selector: { matchLabels: { app: blog } }
  template:
    metadata: { labels: { app: blog } }
    spec:
      containers:
        - name: blog
          image: traefik/whoami:v1.10
          args: [ "--port=8080", "--name=blog" ]
          envFrom: [ { configMapRef: { name: blog-config } } ]
          ports: [ { containerPort: 8080 } ]
---
apiVersion: v1
kind: Service
metadata: { name: blog, namespace: blog }
spec:
  selector: { app: blog }
  ports: [ { port: 80, targetPort: 8080 } ]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: blog, namespace: blog }
spec:
  rules:
    - host: blog.local
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: blog, port: { number: 80 } } } }
